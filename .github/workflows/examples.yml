name: Примеры сделок на истории

on:
  push:
    branches: [examples]
  workflow_dispatch:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt matplotlib
      - run: python tools/examples.py 30
      - uses: actions/upload-artifact@v4
        with:
          name: examples
          path: out/
