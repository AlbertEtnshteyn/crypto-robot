name: Примеры сделок на истории

on:
  workflow_dispatch:
    inputs:
      args:
        description: "дней, ТФ, трейлинги %"
        default: "90 5,15,60 0.5,1,1.5,2,3,5"

permissions:
  contents: write

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt matplotlib
      - run: python tools/examples.py ${{ inputs.args }}
      - name: Картинки в релиз «examples»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && i=0; for f in *; do i=$((i+1)); cp "$f" "ex$(printf %02d $i)-${f#*-}"; done
          ls ex* | sed -e 's/[^A-Za-z0-9._-]//g' >/dev/null
          gh release view examples >/dev/null 2>&1 || gh release create examples --title "Примеры сделок на истории" --notes "Картинки входов и выходов робота" --prerelease
          for f in ex*; do n=$(echo "$f" | sed 's/вход/entry/; s/отсечён/cut/'); [ "$f" = "$n" ] || mv "$f" "$n"; done
          gh release upload examples ex* --clobber
